---
- name: Sync Spark Stack Files (All Nodes)
  hosts: all
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Copy directory from control node to all cluster nodes
      synchronize:
        src: "{{ local_project_root }}/"
        dest: /opt/home-lab/
        recursive: true
        delete: true
      delegate_to: "{{ groups['spark_managers'][0] }}"

    - name: Ensure Spark logging directory exists with correct permissions
      file:
        path: /opt/home-lab/spark-logs
        state: directory
        owner: "1001"
        group: "0"
        mode: '0777'

- name: Setup New Nodes (Labels)
  hosts: "{{ target | default('add_workers') }}"
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Retrieve hostname
      shell: hostname
      register: node_hostname
      changed_when: false

    - name: Apply spark_workers label to new nodes
      shell: docker node update --label-add {{ labels }}=true {{ node_hostname.stdout }}
      when: labels is defined
      delegate_to: "{{ groups['spark_managers'][0] }}"

- name: Deploy Spark Stack (Manager Only)
  hosts: "{{ manager_target | default('spark_managers') }}"
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Log stack deployment info
      debug:
        msg: "Deploying stack: {{ stack_name }} with network: {{ networks }}"

    - name: Check if Docker overlay network exists
      shell: docker network inspect {{ networks }}
      register: network_check
      ignore_errors: true
      changed_when: false

    - name: Create Docker overlay network if not exists
      shell: docker network create --driver overlay {{ networks }}
      when: network_check.rc != 0

    - name: Load environment variables
      shell: grep -h '=' {{ default_env_file }} {{ user_env_file }} | grep -v '^#' | tr '\n' ' '
      register: env_vars
      changed_when: false

    - name: Deploy Spark Stack
      shell: |
        {{ env_vars.stdout }} docker stack deploy \
        -c {{ stack_file }} \
        --detach=true {{ stack_name }}
